# Runs the deterministic gate from CLAUDE.md §5: types, lint, unit tests and evals.
# Needs no secrets: `npm run check` never talks to Supabase or Stripe.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      # EZ-010: BM wording must be approved by the shop owner before it reaches main.
      # Blocks pushes to main and pull requests into main while any TODO(review) marker remains.
      - name: BM translations approved
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: npm run i18n:check

      # Eval numbers for the run (MAE, p95, invariant failures), kept for reading a red gate.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: evals/results/latest.json
          if-no-files-found: ignore

  # SQL smoke suite (migrations + seed + supabase/tests/smoke.sql) on a throwaway
  # Postgres, on every weekday at 10:00 and 23:50 with the clock pinned
  # (see supabase/tests/run-weekdays.sh).
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install PostgreSQL server and libfaketime
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends faketime
          if ! ls -d /usr/lib/postgresql/*/bin >/dev/null 2>&1; then
            sudo apt-get install -y -q --no-install-recommends postgresql
          fi
          pg_bin="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          "$pg_bin/postgres" --version
          echo "PG_BIN=$pg_bin" >> "$GITHUB_ENV"

      - run: npm run test:db:week
